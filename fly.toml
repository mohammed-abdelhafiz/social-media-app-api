# fly.toml app configuration file generated for social-media-app-api on 2026-03-29T19:54:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'social-media-app-api'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
